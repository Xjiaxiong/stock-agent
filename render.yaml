# Render Blueprint：在 Render 控制台选 "New + / Blueprint" 并关联本仓库即可
services:
  - type: web
    name: stock-agent-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false # 部署时在 Render 面板手动填写
      - key: CORS_ORIGINS
        value: https://stock-agent.vercel.app
